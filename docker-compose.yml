services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: safetymain
      POSTGRES_USER: safetymain
      POSTGRES_PASSWORD: safetymain
    ports:
      - "5432:5432"
    volumes:
      - safetymain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetymain -d safetymain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for development (ADR-0006). The upstream
  # minio/minio and minio/mc images are no longer published anonymously;
  # Chainguard builds both from the MinIO open-source tree. Chainguard's free
  # tier only publishes `latest`, so both images are pinned by digest and
  # updated deliberately (`docker buildx imagetools inspect <image>:latest`).
  minio:
    # MinIO RELEASE.2026-09-22T19-25-18Z
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: safetymain
      MINIO_ROOT_PASSWORD: safetymain-minio
      # Browsers upload and download directly with presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3100
    ports:
      - "9000:9000"
    volumes:
      - safetymain_minio_data:/data

  # One-shot bucket bootstrap; retries until MinIO accepts connections.
  minio-bootstrap:
    image: cgr.dev/chainguard/minio-client@sha256:231c5976b6145971a5440dcd99257b23840513999f87cbcb68cd6a8ba674ca51
    command: ["mb", "--ignore-existing", "local/safetymain-documents"]
    environment:
      MC_HOST_local: http://safetymain:safetymain-minio@minio:9000
    depends_on:
      - minio
    restart: on-failure

volumes:
  safetymain_postgres_data:
  safetymain_minio_data:
